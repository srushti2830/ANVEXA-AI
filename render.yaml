services:
  - type: web
    name: anvexa-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANVEXA_ENVIRONMENT
        value: production
      - key: ANVEXA_API_V1_PREFIX
        value: /api/v1
      - key: ANVEXA_DATABASE_URL
        sync: false
      - key: ANVEXA_JWT_SECRET_KEY
        generateValue: true
      - key: ANVEXA_GEMINI_API_KEY
        sync: false
      - key: ANVEXA_CORS_ORIGINS
        sync: false
