services:
  - type: web
    name: anvexa-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ANVEXA_ENVIRONMENT
        value: production
      - key: ANVEXA_API_V1_PREFIX
        value: /api/v1
      - key: ANVEXA_DATABASE_URL
        sync: false
      - key: ANVEXA_JWT_SECRET_KEY
        generateValue: true
      - key: ANVEXA_GEMINI_API_KEY
        sync: false
      - key: ANVEXA_CORS_ORIGINS
        sync: false
      - key: ANVEXA_OBJECT_STORAGE_BACKEND
        value: s3
      - key: ANVEXA_S3_BUCKET
        sync: false
      - key: ANVEXA_S3_REGION
        sync: false
      - key: ANVEXA_S3_ENDPOINT_URL
        sync: false
      - key: ANVEXA_S3_ACCESS_KEY_ID
        sync: false
      - key: ANVEXA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ANVEXA_S3_PREFIX
        value: anvexa/documents
